[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quadrium"
version = "0.1.0"
description = "Scientific software for constructing Supply-Use and Input-Output systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Albert Roca Florido" }]
keywords = ["input-output", "supply-use", "national-accounts", "economics",
            "SNA", "ESA-2010", "GRAS", "RAS"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "openpyxl>=3.1"]

[project.optional-dependencies]
pdf = ["pymupdf>=1.23"]
# The engine is numpy-only on purpose and stays that way: `sign_pattern_feasible`
# falls back to its per-line test when scipy is absent, and says so. But the
# VALIDATOR for that function cannot do its job without the exact test, so scipy
# is a checking dependency. It was undeclared until CI ran without it and the
# validator failed, correctly, rather than passing on a test it had not run.
dev = ["pytest>=7", "scipy>=1.10"]

[project.scripts]
quadrium = "quadrium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
